<title>Simulador de Inversiones</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d14; --surface: #111520; --card: #161c2e; --border: #1f2a42;
    --accent: #00e5a0; --accent2: #ff6b35; --accent3: #ffd166;
    --text: #e8edf8; --muted: #7a8aaa; --nd: #3a4160; --danger: #ff4d6d;
    --nu-color: #820AD1; --kubo-color: #7bba25;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* Comportamiento de App Nativa */
  body { 
    background: var(--bg); color: var(--text); 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    min-height: 100vh; 
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: hidden; 
    -webkit-tap-highlight-color: transparent; 
    -webkit-touch-callout: none;
    user-select: none; 
    overscroll-behavior-y: none; 
  }
  
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,229,160,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,160,0.02) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  
  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 1rem 4rem 1rem; }
  
  /* Sticky Header Premium */
  header { 
    position: sticky; 
    top: 0; 
    z-index: 100; 
    text-align: center; 
    padding: 1.5rem 1rem 1rem 1rem; 
    background: rgba(10, 13, 20, 0.85); 
    backdrop-filter: blur(12px); 
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    margin: 0 -1rem 1.5rem -1rem;
  }
  
  .badge { display: inline-block; background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); color: var(--accent); font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.35rem 0.9rem; border-radius: 100px; margin-bottom: 0.8rem; }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(1.6rem, 5vw, 2.5rem); line-height: 1.1; margin-bottom: 0; }
  h1 span { color: var(--accent); font-style: italic; }
  
  /* TOGGLE SWITCH ESTILOS */
  .profile-switcher { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; margin-bottom: 2rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden;}
  .profile-switcher::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #820AD1, #ff6b35, #00e5a0); }
  .ps-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; color: #fff;}
  .toggle-wrap { display: flex; align-items: center; justify-content: center; gap: 1rem; }
  .toggle-label { font-size: 0.85rem; font-weight: 500; color: var(--muted); transition: color 0.3s; cursor: pointer; }
  .toggle-label.active-strict { color: var(--accent); }
  .toggle-label.active-turbo { color: var(--nu-color); }
  
  .switch { position: relative; display: inline-block; width: 60px; height: 32px; flex-shrink: 0;}
